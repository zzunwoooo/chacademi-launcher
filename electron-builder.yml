appId: kr.chacademi.launcher
productName: '차카데미'
executableName: 'Chacademi Launcher'
artifactName: 'Chacademi-Launcher-setup-${version}.${ext}'

copyright: 'Copyright © 2018-2026 Daniel Scalzi'

asar: true
compression: 'maximum'

files:
  - '!library-transfer-current/**'
  - '!distribution-assets/**'
  - '!*-result.json'
  - '!release-files.json'
  - '!*.log'
  - '!dist*/**'
  - '!app/assets/images/backgrounds/**'
  - '!tools/**'
  - '!release-input*'
  - '!payload/**'
  - '!release-output/**'
  - '!{dist,.gitignore,.vscode,docs,dev-app-update.yml,.nvmrc,eslint.config.mjs}'

extraResources:
  - 'libraries'

# Windows Configuration
win:
  signAndEditExecutable: true
  icon: build/icon.ico
  target: 
    - target: 'zip'
      arch: 'x64'
    - target: 'nsis'
      arch: 'x64'

# Windows Installer Configuration
nsis:
  installerIcon: build/icon.ico
  uninstallerIcon: build/icon.ico
  installerHeaderIcon: build/icon.ico
  uninstallDisplayName: '차카데미'
  shortcutName: '차카데미'
  oneClick: false
  perMachine: false
  allowElevation: true
  allowToChangeInstallationDirectory: true
  installerLanguages: [ko_KR]
  language: '1042'

# macOS Configuration
mac:
  icon: build/icon.icns
  target:
    - target: 'dmg'
      arch:
        - 'x64'
        - 'arm64'
  artifactName: 'Chacademi-Launcher-setup-${version}-${arch}.${ext}'
  category: 'public.app-category.games'

# Linux Configuration
linux: 
  icon: build/icon.png
  target: 'AppImage'
  maintainer: 'Daniel Scalzi'
  vendor: 'Daniel Scalzi'
  synopsis: '차카데미 마인크래프트 런처'
  description: '차카데미 서버 접속에 필요한 모드와 설정을 자동으로 준비하는 런처입니다.'
  category: 'Game'


directories:
  buildResources: 'build'
  output: 'dist'

publish:
  provider: github
  owner: zzunwoooo
  repo: chacademi-launcher
  releaseType: release

forceCodeSigning: false

afterPack: tools/verify-packaged-dependencies.cjs
