appId: kr.chacademi.launcher
productName: '차카데미 테스트 런처'
executableName: 'Chacademi Launcher'
artifactName: 'Chacademi-Launcher-setup-${version}.${ext}'

copyright: 'Copyright © 2018-2026 Daniel Scalzi'

asar: true
compression: 'maximum'

files:
  - '!library-transfer-current/**'
  - '!distribution-assets/**'
  - '!*-result.json'
  - '!release-files.json'
  - '!*.log'
  - '!dist*/**'
  - '!app/assets/images/backgrounds/**'
  - '!tools/**'
  - '!release-input*'
  - '!payload/**'
  - '!release-output/**'
  - '!{dist,.gitignore,.vscode,docs,dev-app-update.yml,.nvmrc,eslint.config.mjs}'

extraResources:
  - 'libraries'

# Windows Configuration
win:
  signAndEditExecutable: false
  target: 
    - target: 'zip'
      arch: 'x64'
    - target: 'nsis'
      arch: 'x64'

# Windows Installer Configuration
nsis:
  uninstallDisplayName: '차카데미 테스트 런처'
  shortcutName: '차카데미 테스트 런처'
  oneClick: false
  perMachine: false
  allowElevation: true
  allowToChangeInstallationDirectory: true

# macOS Configuration
mac:
  target:
    - target: 'dmg'
      arch:
        - 'x64'
        - 'arm64'
  artifactName: 'Chacademi-Launcher-setup-${version}-${arch}.${ext}'
  category: 'public.app-category.games'

# Linux Configuration
linux: 
  target: 'AppImage'
  maintainer: 'Daniel Scalzi'
  vendor: 'Daniel Scalzi'
  synopsis: 'Modded Minecraft Launcher'
  description: 'Custom launcher which allows users to join modded servers. All mods, configurations, and updates are handled automatically.'
  category: 'Game'


directories:
  buildResources: 'build'
  output: 'dist'

publish:
  provider: github
  owner: zzunwoooo
  repo: chacademi-launcher
  releaseType: release

forceCodeSigning: false
